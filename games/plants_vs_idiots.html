<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Plants vs Idiots - Ultimate Edition</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: manipulation;
        }

        body {
            background-color: #0f1020;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: fixed;
            width: 100%;
            height: 100%;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 1000px;
            aspect-ratio: 1000 / 600;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            border-radius: 12px;
            overflow: hidden;
            border: 3px solid #ff007f;
            background: #1b263b;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        /* UI OVERLAY STYLING - Dibuat lebih ramping untuk Android */
        #ui-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            background: linear-gradient(to bottom, rgba(15,16,32,0.95), rgba(15,16,32,0));
            pointer-events: none;
            z-index: 10;
        }

        .hud-group {
            display: flex;
            gap: 10px;
            align-items: center;
            font-weight: 800;
            font-size: clamp(11px, 2.5vw, 15px);
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        #ui-bottom {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 8px;
            padding: 6px 10px;
            background: linear-gradient(to top, rgba(15,16,32,0.95), rgba(15,16,32,0));
            z-index: 10;
        }

        .plant-card {
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            width: clamp(52px, 14vw, 75px);
            height: clamp(65px, 18vw, 85px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 4px 2px;
            cursor: pointer;
            transition: all 0.15s ease;
            backdrop-filter: blur(6px);
        }

        .plant-card:hover, .plant-card:active {
            transform: translateY(-2px);
            border-color: #00f5d4;
            background: rgba(0, 245, 212, 0.15);
        }

        .plant-card.selected {
            border-color: #00f5d4;
            background: rgba(0, 245, 212, 0.3);
            box-shadow: 0 0 12px rgba(0, 245, 212, 0.6);
        }

        .plant-card.disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }

        .plant-preview-box {
            width: 26px;
            height: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .plant-card .name {
            font-size: clamp(8px, 2vw, 10px);
            font-weight: 700;
            text-align: center;
            color: #e2e8f0;
            white-space: nowrap;
        }

        .plant-card .cost {
            font-size: clamp(9px, 2.2vw, 11px);
            background: rgba(0,0,0,0.6);
            padding: 1px 4px;
            border-radius: 4px;
            color: #ff007f;
            font-weight: bold;
        }

        /* SCREENS */
        .screen-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 16, 32, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
            padding: 20px;
        }

        .screen-overlay h1 {
            font-size: clamp(1.8rem, 5vw, 3.2rem);
            color: #00f5d4;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 245, 212, 0.5);
            font-weight: 900;
        }

        .screen-overlay p {
            font-size: clamp(0.85rem, 2vw, 1.15rem);
            color: #94a3b8;
            max-width: 450px;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .btn {
            background: linear-gradient(135deg, #ff007f, #7209b7);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: clamp(0.95rem, 2vw, 1.25rem);
            font-weight: 800;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 0, 127, 0.4);
            transition: all 0.2s ease;
        }

        .btn:hover, .btn:active {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 0, 127, 0.6);
        }

        .hidden {
            display: none !important;
        }

        #monkey-popup {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.8);
            width: 50%;
            max-width: 400px;
            height: auto;
            border-radius: 12px;
            border: 4px solid #ff007f;
            box-shadow: 0 0 40px rgba(255, 0, 127, 0.8);
            z-index: 50;
            opacity: 0;
            pointer-events: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        #monkey-popup.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="1000" height="600"></canvas>
        <img id="monkey-popup" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTaoRJ4T5OmBRqp5TO-0FgFMlyHkLnTSqSKAV0xioi-rg&s=10" alt="Middle Finger Monkey">

        <div id="ui-top">
            <div class="hud-group" style="color: #ffd166;">
                <span>⚡ <span id="energy-display">150</span></span>
            </div>
            <div class="hud-group" style="color: #00f5d4;">
                <span id="wave-display">WAVE 1 / 5</span>
            </div>
            <div class="hud-group" style="color: #ff5252;">
                <span>🛡️ <span id="house-hp-display">█████</span></span>
            </div>
        </div>

        <div id="ui-bottom">
            <div class="plant-card" onclick="selectPlant('sunflower')">
                <div class="plant-preview-box">
                    <svg width="24" height="24" viewBox="0 0 36 36">
                        <circle cx="18" cy="18" r="14" fill="#ffb703" />
                        <circle cx="18" cy="18" r="7" fill="#3a86ff" />
                    </svg>
                </div>
                <span class="name">Sun Gen</span>
                <span class="cost">50</span>
            </div>
            <div class="plant-card" onclick="selectPlant('peashooter')">
                <div class="plant-preview-box">
                    <svg width="24" height="24" viewBox="0 0 36 36">
                        <rect x="6" y="12" width="18" height="14" rx="4" fill="#38b000" />
                        <rect x="20" y="15" width="10" height="8" rx="2" fill="#70e000" />
                    </svg>
                </div>
                <span class="name">Pea Shooter</span>
                <span class="cost">100</span>
            </div>
            <div class="plant-card" onclick="selectPlant('wallpotato')">
                <div class="plant-preview-box">
                    <svg width="24" height="24" viewBox="0 0 36 36">
                        <ellipse cx="18" cy="18" rx="13" ry="15" fill="#bc6c25" />
                        <ellipse cx="18" cy="18" rx="9" ry="11" fill="#dda15e" />
                    </svg>
                </div>
                <span class="name">Wall Potato</span>
                <span class="cost">75</span>
            </div>
        </div>

        <div id="start-screen" class="screen-overlay">
            <h1>PLANTS VS IDIOTS</h1>
            <p>Hadapi gerombolan orang idiot yang konyol! Lindungi markasmu sekarang.</p>
            <button class="btn" onclick="startGame()">MULAI BERMAIN</button>
        </div>

        <div id="gameover-screen" class="screen-overlay hidden">
            <h1 style="color: #ff5252;">GAME OVER</h1>
            <p id="gameover-stats">Markasmu berhasil diterobos para idiot!</p>
            <button class="btn" onclick="restartGame()">COBA LAGI</button>
        </div>

        <div id="victory-screen" class="screen-overlay hidden">
            <h1>VICTORY!</h1>
            <p id="victory-stats">Semua gelombang idiot berhasil dihentikan!</p>
            <button class="btn" onclick="restartGame()">MAIN LAGI</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        const COLS = 9;
        const LANES = 5;
        const TILE_W = 90;
        const TILE_H = 95;
        const GRID_OFFSET_X = 110;
        const GRID_OFFSET_Y = 100;

        let gameState = 'START';
        let energy = 150;
        let houseHP = 5;
        let maxHouseHP = 5;
        let currentWave = 1;
        let maxWaves = 5;
        let waveTimer = 0;
        let waveEnemiesSpawned = 0;
        let enemiesPerWave = 8;
        let selectedPlantType = null;

        let gameTimeElapsed = 0;
        let monkeyTriggerTime = 0;
        let hasMonkeyTriggered = false;

        let grid = [];
        let plants = [];
        let enemies = [];
        let projectiles = [];
        let suns = [];
        let particles = [];
        let lawnMowers = [];

        const PLANT_TYPES = {
            sunflower: { cost: 50, hp: 70 },
            peashooter: { cost: 100, hp: 100 },
            wallpotato: { cost: 75, hp: 450 }
        };

        function triggerMonkeyPopup() {
            const monkeyEl = document.getElementById('monkey-popup');
            monkeyEl.classList.add('show');
            setTimeout(() => {
                monkeyEl.classList.remove('show');
            }, 700);
        }

        function initGrid() {
            grid = [];
            for (let r = 0; r < LANES; r++) {
                grid[r] = [];
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = null;
                }
            }
        }

        function initLawnMowers() {
            lawnMowers = [];
            for (let r = 0; r < LANES; r++) {
                lawnMowers.push({
                    lane: r,
                    x: GRID_OFFSET_X - 45,
                    y: GRID_OFFSET_Y + r * TILE_H + TILE_H / 2,
                    active: false,
                    triggered: false
                });
            }
        }

        function startGame() {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('gameover-screen').classList.add('hidden');
            document.getElementById('victory-screen').classList.add('hidden');
            
            energy = 150;
            houseHP = maxHouseHP;
            currentWave = 1;
            waveTimer = 0;
            waveEnemiesSpawned = 0;
            
            gameTimeElapsed = 0;
            hasMonkeyTriggered = false;
            monkeyTriggerTime = Math.random() * 40;

            plants = [];
            enemies = [];
            projectiles = [];
            suns = [];
            particles = [];
            
            initGrid();
            initLawnMowers();
            gameState = 'PLAYING';
        }

        function restartGame() {
            startGame();
        }

        function handleCanvasClick(clientX, clientY) {
            if (gameState !== 'PLAYING') return;

            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            const mouseX = (clientX - rect.left) * scaleX;
            const mouseY = (clientY - rect.top) * scaleY;

            for (let i = suns.length - 1; i >= 0; i--) {
                let s = suns[i];
                let dist = Math.hypot(mouseX - s.x, mouseY - s.y);
                if (dist < 35) {
                    energy += 25;
                    createFloatingText('+25 ⚡', s.x, s.y, '#ffd166');
                    suns.splice(i, 1);
                    return;
                }
            }

            if (selectedPlantType) {
                let col = Math.floor((mouseX - GRID_OFFSET_X) / TILE_W);
                let lane = Math.floor((mouseY - GRID_OFFSET_Y) / TILE_H);

                if (col >= 0 && col < COLS && lane >= 0 && lane < LANES) {
                    let cost = PLANT_TYPES[selectedPlantType].cost;
                    if (!grid[lane][col] && energy >= cost) {
                        energy -= cost;
                        
                        let plantObj = {
                            type: selectedPlantType,
                            lane: lane,
                            col: col,
                            x: GRID_OFFSET_X + col * TILE_W + TILE_W / 2,
                            y: GRID_OFFSET_Y + lane * TILE_H + TILE_H / 2,
                            hp: PLANT_TYPES[selectedPlantType].hp,
                            maxHp: PLANT_TYPES[selectedPlantType].hp,
                            attackTimer: 0,
                            productionTimer: 0
                        };

                        grid[lane][col] = plantObj;
                        plants.push(plantObj);
                        selectedPlantType = null;
                        updateCardSelection();
                    }
                }
            }
        }

        canvas.addEventListener('click', (e) => {
            handleCanvasClick(e.clientX, e.clientY);
        });

        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length > 0) {
                const touch = e.touches[0];
                handleCanvasClick(touch.clientX, touch.clientY);
                e.preventDefault();
            }
        }, { passive: false });

        function selectPlant(type) {
            let cost = PLANT_TYPES[type].cost;
            if (energy >= cost) {
                selectedPlantType = selectedPlantType === type ? null : type;
                updateCardSelection();
            }
        }

        function updateCardSelection() {
            const cards = document.querySelectorAll('.plant-card');
            cards.forEach(card => card.classList.remove('selected'));
        }

        function update(dt) {
            if (gameState !== 'PLAYING') return;

            gameTimeElapsed += dt;
            if (!hasMonkeyTriggered && gameTimeElapsed >= monkeyTriggerTime) {
                hasMonkeyTriggered = true;
                triggerMonkeyPopup();
            }

            document.getElementById('energy-display').innerText = energy;
            document.getElementById('wave-display').innerText = `WAVE ${currentWave} / ${maxWaves}`;
            document.getElementById('house-hp-display').innerText = '█'.repeat(houseHP) + '░'.repeat(maxHouseHP - houseHP);

            const cards = document.querySelectorAll('.plant-card');
            cards[0].classList.toggle('disabled', energy < 50);
            cards[1].classList.toggle('disabled', energy < 100);
            cards[2].classList.toggle('disabled', energy < 75);

            waveTimer += dt;
            if (waveTimer > 3 && waveEnemiesSpawned < enemiesPerWave + currentWave * 3) {
                waveTimer = 0;
                spawnEnemy();
                waveEnemiesSpawned++;
            }

            if (waveEnemiesSpawned >= enemiesPerWave + currentWave * 3 && enemies.length === 0) {
                if (currentWave < maxWaves) {
                    currentWave++;
                    waveEnemiesSpawned = 0;
                    createFloatingText(`WAVE ${currentWave}!`, canvas.width / 2, 80, '#00f5d4');
                } else {
                    gameState = 'VICTORY';
                    document.getElementById('victory-screen').classList.remove('hidden');
                }
            }

            if (Math.random() < 0.005) {
                suns.push({
                    x: GRID_OFFSET_X + Math.random() * (COLS * TILE_W),
                    y: -20,
                    targetY: GRID_OFFSET_Y + Math.random() * (LANES * TILE_H),
                    life: 350
                });
            }
            suns.forEach(s => {
                if (s.y < s.targetY) s.y += 1.5;
                s.life--;
            });
            suns = suns.filter(s => s.life > 0);

            plants.forEach(p => {
                if (p.type === 'sunflower') {
                    p.productionTimer += dt;
                    if (p.productionTimer > 7) {
                        p.productionTimer = 0;
                        suns.push({ x: p.x, y: p.y - 15, targetY: p.y + 20, life: 300 });
                    }
                } else if (p.type === 'peashooter') {
                    p.attackTimer += dt;
                    let enemyInLane = enemies.some(e => e.lane === p.lane && e.x > p.x && e.x < canvas.width);
                    if (enemyInLane && p.attackTimer > 1.2) {
                        p.attackTimer = 0;
                        projectiles.push({
                            x: p.x + 20,
                            y: p.y - 5,
                            speed: 8,
                            damage: 30,
                            lane: p.lane
                        });
                    }
                }
            });

            projectiles.forEach(proj => {
                proj.x += proj.speed;
            });
            projectiles = projectiles.filter(proj => proj.x < canvas.width);

            enemies.forEach(e => {
                let collidingPlant = plants.find(p => p.lane === e.lane && Math.abs(p.x - e.x) < 30);
                
                if (collidingPlant) {
                    e.isEating = true;
                    collidingPlant.hp -= 0.7;
                    if (collidingPlant.hp <= 0) {
                        grid[collidingPlant.lane][collidingPlant.col] = null;
                        plants = plants.filter(p => p !== collidingPlant);
                        e.isEating = false;
                    }
                } else {
                    e.isEating = false;
                    e.x -= e.speed;
                }

                if (e.x < GRID_OFFSET_X - 60) {
                    let mower = lawnMowers.find(m => m.lane === e.lane && !m.triggered);
                    if (mower) {
                        mower.triggered = true;
                        mower.active = true;
                    } else if (!lawnMowers.find(m => m.lane === e.lane && m.active)) {
                        houseHP--;
                        e.dead = true;
                        createFloatingText('CRASH! -1', 80, GRID_OFFSET_Y + e.lane * TILE_H, '#ff5252');
                        if (houseHP <= 0) {
                            gameState = 'GAMEOVER';
                            document.getElementById('gameover-screen').classList.remove('hidden');
                        }
                    }
                }
            });

            lawnMowers.forEach(m => {
                if (m.active) {
                    m.x += 10;
                    enemies.forEach(e => {
                        if (e.lane === m.lane && Math.abs(e.x - m.x) < 35) {
                            e.dead = true;
                            createDataParticle(e.x, e.y, '#ff007f');
                        }
                    });
                    if (m.x > canvas.width) m.active = false;
                }
            });
            enemies = enemies.filter(e => !e.dead && e.x < canvas.width + 50);

            projectiles.forEach((proj, pIdx) => {
                enemies.forEach(e => {
                    if (e.lane === proj.lane && Math.abs(e.x - proj.x) < 25) {
                        e.hp -= proj.damage;
                        createDataParticle(proj.x, proj.y, '#00f5d4');
                        projectiles.splice(pIdx, 1);
                        if (e.hp <= 0) {
                            e.dead = true;
                            createFloatingText('K.O!', e.x, e.y - 20, '#ffd166');
                        }
                    }
                });
            });
        }

        function spawnEnemy() {
            let lane = Math.floor(Math.random() * LANES);
            let typeRand = Math.random();
            let isRunner = typeRand > 0.6;

            enemies.push({
                lane: lane,
                x: canvas.width + 40,
                y: GRID_OFFSET_Y + lane * TILE_H + TILE_H / 2,
                hp: isRunner ? 60 : 120,
                maxHp: isRunner ? 60 : 120,
                speed: isRunner ? 1.5 : 0.65,
                type: isRunner ? 'runner' : 'normal',
                idiotVariant: Math.floor(Math.random() * 3),
                isEating: false,
                dead: false
            });
        }

        function createFloatingText(text, x, y, color) {
            floatingTexts.push({ text, x, y, alpha: 1, color });
        }

        function createDataParticle(x, y, color) {
            for (let i = 0; i < 6; i++) {
                particles.push({
                    x, y,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    alpha: 1,
                    color
                });
            }
        }

        let floatingTexts = [];

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let r = 0; r < LANES; r++) {
                ctx.fillStyle = r % 2 === 0 ? '#131b2e' : '#17223b';
                ctx.fillRect(0, GRID_OFFSET_Y + r * TILE_H, canvas.width, TILE_H);
                
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(0, GRID_OFFSET_Y + (r + 1) * TILE_H);
                ctx.lineTo(canvas.width, GRID_OFFSET_Y + (r + 1) * TILE_H);
                ctx.stroke();
            }

            ctx.fillStyle = '#ff007f';
            ctx.fillRect(20, GRID_OFFSET_Y - 10, GRID_OFFSET_X - 30, LANES * TILE_H + 20);
            ctx.fillStyle = '#0f1020';
            ctx.fillRect(28, GRID_OFFSET_Y + 10, GRID_OFFSET_X - 46, LANES * TILE_H - 20);

            for (let r = 0; r < LANES; r++) {
                for (let c = 0; c < COLS; c++) {
                    let tx = GRID_OFFSET_X + c * TILE_W;
                    let ty = GRID_OFFSET_Y + r * TILE_H;
                    ctx.strokeStyle = 'rgba(0, 245, 212, 0.05)';
                    ctx.lineWidth = 1;
                    ctx.strokeRect(tx, ty, TILE_W, TILE_H);
                }
            }

            lawnMowers.forEach(m => {
                ctx.fillStyle = m.triggered ? '#ff007f' : '#3a86ff';
                ctx.fillRect(m.x, m.y - 18, 30, 36);
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(m.x + 15, m.y, 8, 0, Math.PI * 2);
                ctx.fill();
            });

            plants.forEach(p => {
                ctx.save();
                ctx.translate(p.x, p.y);
                let pulse = Math.sin(Date.now() / 150) * 2;

                if (p.type === 'sunflower') {
                    ctx.fillStyle = '#ffb703';
                    ctx.beginPath();
                    ctx.arc(0, 0, 22 + pulse * 0.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fb8500';
                    ctx.beginPath();
                    ctx.arc(0, 0, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else if (p.type === 'peashooter') {
                    ctx.fillStyle = '#38b000';
                    ctx.beginPath();
                    ctx.roundRect(-16, -14 + pulse, 28, 28, 6);
                    ctx.fill();
                    ctx.fillStyle = '#70e000';
                    ctx.beginPath();
                    ctx.roundRect(4, -8 + pulse, 18, 16, 4);
                    ctx.fill();
                } else if (p.type === 'wallpotato') {
                    ctx.fillStyle = '#bc6c25';
                    ctx.beginPath();
                    ctx.roundRect(-18, -22, 36, 44, 10);
                    ctx.fill();
                    ctx.fillStyle = '#dda15e';
                    ctx.beginPath();
                    ctx.roundRect(-12, -16, 24, 32, 6);
                    ctx.fill();
                }

                ctx.restore();

                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(p.x - 22, p.y + 26, 44, 5);
                ctx.fillStyle = '#00f5d4';
                ctx.fillRect(p.x - 22, p.y + 26, 44 * (p.hp / p.maxHp), 5);
            });

            ctx.fillStyle = '#00f5d4';
            projectiles.forEach(proj => {
                ctx.beginPath();
                ctx.arc(proj.x, proj.y, 6, 0, Math.PI * 2);
                ctx.fill();
            });

            enemies.forEach(e => {
                ctx.save();
                ctx.translate(e.x, e.y);

                let bounce = Math.sin(Date.now() / 70) * 4;

                ctx.fillStyle = e.type === 'runner' ? '#ff5400' : '#4361ee';
                ctx.beginPath();
                ctx.roundRect(-16, -20 + bounce, 32, 40, 8);
                ctx.fill();

                ctx.fillStyle = '#ffdbac';
                ctx.beginPath();
                ctx.arc(0, -26 + bounce, 14, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(-5, -28 + bounce, 5, 0, Math.PI * 2);
                ctx.arc(5, -28 + bounce, 5, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(e.type === 'runner' ? -4 : -6, -28 + bounce, 2, 0, Math.PI * 2);
                ctx.arc(e.type === 'runner' ? 6 : 4, -28 + bounce, 2, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(0, -20 + bounce, 5, 0, Math.PI);
                ctx.stroke();

                if (e.idiotVariant === 0) {
                    ctx.fillStyle = '#7209b7';
                    ctx.fillRect(-6, -44 + bounce, 12, 6);
                } else if (e.idiotVariant === 1) {
                    ctx.fillStyle = '#ff007f';
                    ctx.fillRect(-12, -38 + bounce, 20, 5);
                    ctx.fillRect(2, -43 + bounce, 12, 5);
                } else {
                    ctx.fillStyle = 'rgba(255,255,255,0.3)';
                    ctx.beginPath();
                    ctx.arc(-4, -34 + bounce, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();

                ctx.fillStyle = 'rgba(0,0,0,0.6)';
                ctx.fillRect(e.x - 20, e.y + 28, 40, 5);
                ctx.fillStyle = '#ff007f';
                ctx.fillRect(e.x - 20, e.y + 28, 40 * (e.hp / e.maxHp), 5);
            });

            suns.forEach(s => {
                ctx.fillStyle = '#ffd166';
                ctx.beginPath();
                ctx.arc(s.x, s.y, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
                ctx.fill();
            });

            particles.forEach(pt => {
                ctx.fillStyle = pt.color;
                ctx.globalAlpha = pt.alpha;
                ctx.fillRect(pt.x, pt.y, 5, 5);
                ctx.globalAlpha = 1.0;
                pt.x += pt.vx;
                pt.y += pt.vy;
                pt.alpha -= 0.035;
            });
            particles = particles.filter(pt => pt.alpha > 0);

            floatingTexts.forEach(ft => {
                ctx.font = 'bold 18px sans-serif';
                ctx.fillStyle = ft.color;
                ctx.globalAlpha = ft.alpha;
                ctx.textAlign = 'center';
                ctx.fillText(ft.text, ft.x, ft.y);
                ctx.globalAlpha = 1.0;
                ft.y -= 0.9;
                ft.alpha -= 0.025;
            });
            floatingTexts = floatingTexts.filter(ft => ft.alpha > 0);
        }

        let lastTime = 0;
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            let dt = (timestamp - lastTime) / 1000;
            lastTime = timestamp;

            if (gameState === 'PLAYING') {
                update(dt);
            }
            draw();

            requestAnimationFrame(gameLoop);
        }

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
