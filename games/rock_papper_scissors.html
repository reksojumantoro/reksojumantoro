<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RPS: OUTSMART</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d0f17;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            max-width: 480px;
            max-height: 850px;
            background: #141824;
            box-shadow: 0 0 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px 15px;
            color: #fff;
        }

        /* HEADER HUD */
        .hud-top {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.05);
            padding: 10px 15px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .streak-badge { font-size: 18px; font-weight: 900; color: #ff9800; }
        .score-badge { font-size: 15px; font-weight: 700; color: #4caf50; }
        .timer-badge { font-size: 18px; font-weight: 900; color: #ff1744; background: rgba(255,23,68,0.15); padding: 2px 10px; border-radius: 8px; border: 1px solid #ff1744;}

        /* NPC ARENA */
        .arena {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 5px;
            position: relative;
        }
        .npc-avatar {
            font-size: 65px;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.2s ease;
        }
        .npc-name {
            font-size: 20px;
            font-weight: 900;
            color: #00e676;
            margin-top: 5px;
            text-transform: uppercase;
        }
        .npc-desc {
            font-size: 12px;
            color: #b0bec5;
            margin-bottom: 8px;
            text-align: center;
        }
        .dialog-box {
            background: #1e2436;
            border: 2px solid #00e676;
            padding: 8px 12px;
            border-radius: 15px;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
            text-align: center;
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .dialog-box::after {
            content: '';
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 0 8px 8px 8px;
            border-style: solid;
            border-color: transparent transparent #00e676 transparent;
        }

        /* BATTLE ZONE */
        .battle-zone {
            width: 100%;
            height: 160px;
            display: flex;
            justify-content: space-around;
            align-items: center;
            background: rgba(0,0,0,0.2);
            border-radius: 20px;
            position: relative;
            border: 1px dashed rgba(255,255,255,0.1);
        }
        .hand-card {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .hand-icon {
            font-size: 55px;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .vs-title {
            font-size: 26px;
            font-weight: 900;
            color: #ff1744;
            font-style: italic;
        }

        /* RESULT BANNER WITH ANIMATION */
        .result-banner {
            font-size: 24px;
            font-weight: 900;
            height: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .result-banner.pop {
            transform: scale(1.15);
        }

        /* CONTROLS BUTTONS */
        .controls {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 5px;
        }
        .btn-move {
            background: linear-gradient(145deg, #252b3c, #1a1f2c);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 12px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 #10131d;
        }
        .btn-move:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 #10131d;
        }
        .btn-move.disabled {
            opacity: 0.4;
            cursor: not-allowed;
            filter: grayscale(1);
        }
        .btn-move .emoji { font-size: 32px; }
        .btn-move .label { font-size: 11px; font-weight: 800; margin-top: 4px; color: #b0bec5; }

        /* OVERLAY SCREEN */
        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 18, 0.94);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 10;
            text-align: center;
        }
        .title { font-size: 32px; font-weight: 900; color: #ff9800; margin-bottom: 5px; }
        .subtitle { font-size: 13px; color: #b0bec5; margin-bottom: 20px; }
        .stats-card {
            background: rgba(255,255,255,0.05);
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.1);
        }
        
        /* LANG TOGGLE */
        .lang-select {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .lang-btn {
            background: rgba(255,255,255,0.1);
            border: 2px solid transparent;
            color: #fff;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }
        .lang-btn.active {
            border-color: #ff9800;
            background: rgba(255,152,0,0.2);
            color: #ff9800;
        }

        .btn-action {
            background: linear-gradient(135deg, #ff9800, #f57c00);
            border: none;
            color: #000;
            font-size: 18px;
            font-weight: 900;
            padding: 14px 40px;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255,152,0,0.4);
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Top HUD -->
    <div class="hud-top">
        <div class="streak-badge" id="hud-streak">🔥 0</div>
        <div class="timer-badge" id="hud-timer">⏳ 10s</div>
        <div class="score-badge" id="hud-score">SKOR: 0</div>
    </div>

    <!-- NPC Section -->
    <div class="arena">
        <div class="npc-avatar" id="npc-avatar">🤖</div>
        <div class="npc-name" id="npc-name">NPC</div>
        <div class="npc-desc" id="npc-desc">Description</div>
        <div class="dialog-box" id="npc-dialog">"Ayo tanding kalau berani!"</div>
    </div>

    <!-- Battle Zone -->
    <div class="battle-zone">
        <div class="hand-card">
            <div class="hand-icon" id="npc-hand">❓</div>
            <span style="font-size: 11px; color: #78909c; font-weight: 700; margin-top: 5px;" id="lbl-enemy">MUSUH</span>
        </div>
        <div class="vs-title">VS</div>
        <div class="hand-card">
            <div class="hand-icon" id="player-hand">❓</div>
            <span style="font-size: 11px; color: #78909c; font-weight: 700; margin-top: 5px;" id="lbl-you">KAMU</span>
        </div>
    </div>

    <!-- Result Banner -->
    <div class="result-banner" id="result-banner"></div>

    <!-- Controls -->
    <div class="controls">
        <div class="btn-move" id="btn-rock" onclick="game.play('ROCK')">
            <span class="emoji">🪨</span>
            <span class="label" id="lbl-rock">BATU</span>
        </div>
        <div class="btn-move" id="btn-paper" onclick="game.play('PAPER')">
            <span class="emoji">📄</span>
            <span class="label" id="lbl-paper">KERTAS</span>
        </div>
        <div class="btn-move" id="btn-scissors" onclick="game.play('SCISSORS')">
            <span class="emoji">✂️</span>
            <span class="label" id="lbl-scissors">GUNTING</span>
        </div>
    </div>

    <!-- Start Overlay -->
    <div id="start-screen" class="overlay-screen">
        <div class="title">RPS: OUTSMART</div>
        <div class="subtitle">IT'S NOT ABOUT LUCK. PROBABLY.</div>
        
        <div class="lang-select">
            <button class="lang-btn active" id="btn-lang-id" onclick="game.setLanguage('ID')">🇮🇩 INDONESIA</button>
            <button class="lang-btn" id="btn-lang-en" onclick="game.setLanguage('EN')">🇺🇸 ENGLISH</button>
        </div>

        <div class="stats-card">
            <p style="font-size: 13px; margin-bottom: 5px;" id="lbl-best-streak">REKOR STREAK TERBAIK</p>
            <p style="font-size: 32px; font-weight: 900; color: #ff9800;" id="best-streak">0</p>
        </div>
        <button class="btn-action" id="btn-play-start" onclick="game.start()">MULAI TANDING</button>
    </div>

    <!-- Game Over Overlay -->
    <div id="death-screen" class="overlay-screen" style="display: none;">
        <div class="title" style="color: #ff1744;" id="lbl-gameover">KAMU KALAH 💀</div>
        <div class="subtitle" id="death-reason">Pola kamu berhasil terbaca!</div>
        <div class="stats-card">
            <p style="font-size: 13px;"><span id="lbl-final-streak">STREAK TERAKHIR</span>: <b id="final-streak" style="color: #ff9800;">0</b></p>
            <p style="font-size: 13px; margin-top: 5px;"><span id="lbl-final-score">TOTAL SKOR</span>: <b id="final-score" style="color: #4caf50;">0</b></p>
        </div>
        <button class="btn-action" style="background: linear-gradient(135deg, #ff1744, #d50000);" id="btn-retry" onclick="game.start()">MAIN LAGI</button>
    </div>
</div>

<script>
/**
 * NPC DATA & AI BEHAVIOR PATTERNS
 */
const NPCS_ID = [
    {
        name: "Bocil Roblox",
        avatar: "👦",
        desc: "Suka asal pencet Batu terus.",
        dialogs: ["Pasti lu kalah!", "Batu gak pernah salah!", "Gua spam Batu nih!"],
        getMove: (history) => Math.random() < 0.6 ? 'ROCK' : (Math.random() < 0.5 ? 'PAPER' : 'SCISSORS')
    },
    {
        name: "Anak Warnet",
        avatar: "🎧",
        desc: "Punya pola rotasi berurutan.",
        dialogs: ["Batu, Kertas, Gunting... gampang.", "Pola gua rahasia!", "Lu gak bakal paham strat gua."],
        getMove: (history, npcHistory) => {
            const pattern = ['ROCK', 'PAPER', 'SCISSORS'];
            return pattern[npcHistory.length % 3];
        }
    },
    {
        name: "Bapak Pos Ronda",
        avatar: "👴",
        desc: "Suka ngulang pilihan yang baru menang.",
        dialogs: ["Kopi mana kopi?", "Trik lama ini mah.", "Santai dulu..."],
        getMove: (history, npcHistory, lastResult) => {
            if (lastResult === 'LOSE' && npcHistory.length > 0) return npcHistory[npcHistory.length - 1];
            return ['ROCK', 'PAPER', 'SCISSORS'][Math.floor(Math.random() * 3)];
        }
    },
    {
        name: "Mas-Mas Ojol",
        avatar: "🛵",
        desc: "Mencoba meng-counter pilihan terakhir kamu.",
        dialogs: ["Sesuai aplikasi ya mas.", "Gua udah tahu langkah lu.", "Mau ke mana bos?"],
        getMove: (history) => {
            if (history.length === 0) return 'PAPER';
            const lastPlayerMove = history[history.length - 1];
            if (lastPlayerMove === 'ROCK') return 'PAPER';
            if (lastPlayerMove === 'PAPER') return 'SCISSORS';
            return 'ROCK';
        }
    },
    {
        name: "Emak-Emak SEIN KIRI",
        avatar: "🧕",
        desc: "Bluffing parah. Ngomong A, ngeluarin B.",
        dialogs: ["Gua pasti ngeluarin BATU!", "Ngeluarin GUNTING ah...", "Awas KERTAS melayang!"],
        getMove: (history, npcHistory, lastResult, dialogText) => {
            if (dialogText.includes("BATU")) return Math.random() < 0.7 ? 'SCISSORS' : 'PAPER';
            if (dialogText.includes("GUNTING")) return Math.random() < 0.7 ? 'PAPER' : 'ROCK';
            return Math.random() < 0.7 ? 'ROCK' : 'SCISSORS';
        }
    },
    {
        name: "Dukun Mbah Slamet",
        avatar: "🧙‍♂️",
        desc: "Bisa membaca pikiran (Predictor AI).",
        dialogs: ["Mbah sudah melihat masa depanmu...", "Kamu suka ngeluarin itu kan?", "Percuma, mbah tahu."],
        getMove: (history) => {
            if (history.length < 2) return ['ROCK', 'PAPER', 'SCISSORS'][Math.floor(Math.random() * 3)];
            const counts = { ROCK: 0, PAPER: 0, SCISSORS: 0 };
            history.forEach(m => counts[m]++);
            let favorite = 'ROCK';
            if (counts.PAPER > counts[favorite]) favorite = 'PAPER';
            if (counts.SCISSORS > counts[favorite]) favorite = 'SCISSORS';

            if (favorite === 'ROCK') return 'PAPER';
            if (favorite === 'PAPER') return 'SCISSORS';
            return 'ROCK';
        }
    }
];

const NPCS_EN = [
    {
        name: "Florida Man",
        avatar: "🐊",
        desc: "Unpredictable. Spams Rock aggressively.",
        dialogs: ["Rock beats everything, even gators!", "I'm throwing Rock!", "You can't handle my chaos!"],
        getMove: (history) => Math.random() < 0.6 ? 'ROCK' : (Math.random() < 0.5 ? 'PAPER' : 'SCISSORS')
    },
    {
        name: "Wall Street Bro",
        avatar: "💼",
        desc: "Follows a strict cyclic algorithmic pattern.",
        dialogs: ["It's all about the rotation baby.", "High risk, high reward.", "My algorithm is foolproof."],
        getMove: (history, npcHistory) => {
            const pattern = ['ROCK', 'PAPER', 'SCISSORS'];
            return pattern[npcHistory.length % 3];
        }
    },
    {
        name: "Gym Bro",
        avatar: "🏋️‍♂️",
        desc: "Repeats whatever winning move he used before.",
        dialogs: ["No pain, no gain!", "Gotta hit those reps.", "Solid choice bro!"],
        getMove: (history, npcHistory, lastResult) => {
            if (lastResult === 'LOSE' && npcHistory.length > 0) return npcHistory[npcHistory.length - 1];
            return ['ROCK', 'PAPER', 'SCISSORS'][Math.floor(Math.random() * 3)];
        }
    },
    {
        name: "Karen",
        avatar: "👱‍♀️",
        desc: "Counters your previous move directly.",
        dialogs: ["I want to speak to the manager!", "I know exactly what you did last!", "You won't get away with this!"],
        getMove: (history) => {
            if (history.length === 0) return 'PAPER';
            const lastPlayerMove = history[history.length - 1];
            if (lastPlayerMove === 'ROCK') return 'PAPER';
            if (lastPlayerMove === 'PAPER') return 'SCISSORS';
            return 'ROCK';
        }
    },
    {
        name: "Poker Master",
        avatar: "🕶️",
        desc: "Master of bluffing. Never trust his words.",
        dialogs: ["I am definitely picking ROCK.", "SCISSORS incoming!", "Watch out for my PAPER."],
        getMove: (history, npcHistory, lastResult, dialogText) => {
            if (dialogText.includes("ROCK")) return Math.random() < 0.7 ? 'SCISSORS' : 'PAPER';
            if (dialogText.includes("SCISSORS")) return Math.random() < 0.7 ? 'PAPER' : 'ROCK';
            return Math.random() < 0.7 ? 'ROCK' : 'SCISSORS';
        }
    },
    {
        name: "Tech CEO",
        avatar: "🤓",
        desc: "Uses Machine Learning to predict your habits.",
        dialogs: ["My AI predicted your move.", "You are too predictable.", "Data doesn't lie."],
        getMove: (history) => {
            if (history.length < 2) return ['ROCK', 'PAPER', 'SCISSORS'][Math.floor(Math.random() * 3)];
            const counts = { ROCK: 0, PAPER: 0, SCISSORS: 0 };
            history.forEach(m => counts[m]++);
            let favorite = 'ROCK';
            if (counts.PAPER > counts[favorite]) favorite = 'PAPER';
            if (counts.SCISSORS > counts[favorite]) favorite = 'SCISSORS';

            if (favorite === 'ROCK') return 'PAPER';
            if (favorite === 'PAPER') return 'SCISSORS';
            return 'ROCK';
        }
    }
];

class Game {
    constructor() {
        this.lang = 'ID';
        this.streak = 0;
        this.score = 0;
        this.bestStreak = parseInt(localStorage.getItem('rps_best_streak') || '0');
        
        this.playerHistory = [];
        this.npcHistory = [];
        this.lastResult = null;
        this.currentNPCIndex = 0;
        this.isProcessing = false;

        this.timeLeft = 10;
        this.timerInterval = null;

        document.getElementById('best-streak').innerText = this.bestStreak;
    }

    setLanguage(lang) {
        this.lang = lang;
        document.getElementById('btn-lang-id').classList.toggle('active', lang === 'ID');
        document.getElementById('btn-lang-en').classList.toggle('active', lang === 'EN');

        if (lang === 'ID') {
            document.getElementById('lbl-best-streak').innerText = "REKOR STREAK TERBAIK";
            document.getElementById('btn-play-start').innerText = "MULAI TANDING";
            document.getElementById('lbl-rock').innerText = "BATU";
            document.getElementById('lbl-paper').innerText = "KERTAS";
            document.getElementById('lbl-scissors').innerText = "GUNTING";
            document.getElementById('lbl-enemy').innerText = "MUSUH";
            document.getElementById('lbl-you').innerText = "KAMU";
            document.getElementById('lbl-gameover').innerText = "KAMU KALAH 💀";
            document.getElementById('lbl-final-streak').innerText = "STREAK TERAKHIR";
            document.getElementById('lbl-final-score').innerText = "TOTAL SKOR";
            document.getElementById('btn-retry').innerText = "MAIN LAGI";
        } else {
            document.getElementById('lbl-best-streak').innerText = "BEST STREAK RECORD";
            document.getElementById('btn-play-start').innerText = "START BATTLE";
            document.getElementById('lbl-rock').innerText = "ROCK";
            document.getElementById('lbl-paper').innerText = "PAPER";
            document.getElementById('lbl-scissors').innerText = "SCISSORS";
            document.getElementById('lbl-enemy').innerText = "ENEMY";
            document.getElementById('lbl-you').innerText = "YOU";
            document.getElementById('lbl-gameover').innerText = "YOU LOST 💀";
            document.getElementById('lbl-final-streak').innerText = "FINAL STREAK";
            document.getElementById('lbl-final-score').innerText = "FINAL SCORE";
            document.getElementById('btn-retry').innerText = "PLAY AGAIN";
        }
    }

    start() {
        this.streak = 0;
        this.score = 0;
        this.playerHistory = [];
        this.npcHistory = [];
        this.lastResult = null;
        this.isProcessing = false;

        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('death-screen').style.display = 'none';
        
        this.setButtonsDisabled(false);
        this.nextNPC();
        this.updateHUD();
    }

    startTimer() {
        clearInterval(this.timerInterval);
        this.timeLeft = 10;
        document.getElementById('hud-timer').innerText = `⏳ ${this.timeLeft}s`;

        this.timerInterval = setInterval(() => {
            this.timeLeft--;
            document.getElementById('hud-timer').innerText = `⏳ ${this.timeLeft}s`;

            if (this.timeLeft <= 0) {
                clearInterval(this.timerInterval);
                this.timeOut();
            }
        }, 1000);
    }

    stopTimer() {
        clearInterval(this.timerInterval);
    }

    timeOut() {
        if (this.isProcessing) return;
        this.isProcessing = true;
        this.setButtonsDisabled(true);

        const banner = document.getElementById('result-banner');
        banner.innerText = this.lang === 'ID' ? "WAKTU HABIS!" : "TIME OUT!";
        banner.style.color = "#ff1744";
        banner.classList.add('pop');

        document.getElementById('death-reason').innerText = this.lang === 'ID' ? "Kamu terlalu lama berpikir!" : "You took too long to make a move!";

        setTimeout(() => {
            this.gameOver();
        }, 2000);
    }

    setButtonsDisabled(disabled) {
        const btns = document.querySelectorAll('.btn-move');
        btns.forEach(b => {
            if (disabled) b.classList.add('disabled');
            else b.classList.remove('disabled');
        });
    }

    nextNPC() {
        const npcList = this.lang === 'ID' ? NPCS_ID : NPCS_EN;
        this.currentNPCIndex = Math.floor(Math.random() * npcList.length);
        const npc = npcList[this.currentNPCIndex];

        document.getElementById('npc-avatar').innerText = npc.avatar;
        document.getElementById('npc-name').innerText = npc.name;
        document.getElementById('npc-desc').innerText = npc.desc;
        
        const randomDialog = npc.dialogs[Math.floor(Math.random() * npc.dialogs.length)];
        document.getElementById('npc-dialog').innerText = `"${randomDialog}"`;

        document.getElementById('npc-hand').innerText = '❓';
        document.getElementById('player-hand').innerText = '❓';
        
        const banner = document.getElementById('result-banner');
        banner.innerText = '';
        banner.classList.remove('pop');

        this.startTimer();
    }

    updateHUD() {
        document.getElementById('hud-streak').innerText = `🔥 ${this.streak}`;
        document.getElementById('hud-score').innerText = `${this.lang === 'ID' ? 'SKOR' : 'SCORE'}: ${this.score}`;
    }

    play(playerMove) {
        if (this.isProcessing) return;
        this.isProcessing = true;
        this.stopTimer();
        this.setButtonsDisabled(true);

        const npcList = this.lang === 'ID' ? NPCS_ID : NPCS_EN;
        const npc = npcList[this.currentNPCIndex];
        const dialogText = document.getElementById('npc-dialog').innerText;
        const npcMove = npc.getMove(this.playerHistory, this.npcHistory, this.lastResult, dialogText);

        const emojiMap = { ROCK: '🪨', PAPER: '📄', SCISSORS: '✂️' };

        document.getElementById('player-hand').innerText = emojiMap[playerMove];
        document.getElementById('npc-hand').innerText = '✊';

        let count = 0;
        const interval = setInterval(() => {
            count++;
            document.getElementById('npc-hand').style.transform = `translateY(${count % 2 === 0 ? -10 : 0}px)`;
            if (count >= 4) {
                clearInterval(interval);
                document.getElementById('npc-hand').style.transform = 'none';
                document.getElementById('npc-hand').innerText = emojiMap[npcMove];
                this.evaluate(playerMove, npcMove);
            }
        }, 120);
    }

    evaluate(playerMove, npcMove) {
        this.playerHistory.push(playerMove);
        this.npcHistory.push(npcMove);

        const banner = document.getElementById('result-banner');
        banner.classList.add('pop');

        if (playerMove === npcMove) {
            // DRAW
            this.lastResult = 'DRAW';
            banner.innerText = this.lang === 'ID' ? "SERI! REMATCH" : "DRAW! REMATCH";
            banner.style.color = "#ffeb3b";
            
            setTimeout(() => {
                this.isProcessing = false;
                this.setButtonsDisabled(false);
                document.getElementById('npc-hand').innerText = '❓';
                document.getElementById('player-hand').innerText = '❓';
                banner.innerText = '';
                banner.classList.remove('pop');
                this.startTimer();
            }, 2500);
            return;
        }

        const isWin = (
            (playerMove === 'ROCK' && npcMove === 'SCISSORS') ||
            (playerMove === 'PAPER' && npcMove === 'ROCK') ||
            (playerMove === 'SCISSORS' && npcMove === 'PAPER')
        );

        if (isWin) {
            // WIN
            this.lastResult = 'WIN';
            this.streak++;
            
            const multiplier = Math.min(Math.floor(this.streak / 3) + 1, 10);
            const addedScore = 100 * multiplier;
            this.score += addedScore;

            banner.innerText = `${this.lang === 'ID' ? 'MENANG' : 'WIN'}! (+${addedScore})`;
            banner.style.color = "#00e676";

            if (this.streak > this.bestStreak) {
                this.bestStreak = this.streak;
                localStorage.setItem('rps_best_streak', this.bestStreak);
            }

            this.updateHUD();

            setTimeout(() => {
                this.isProcessing = false;
                this.setButtonsDisabled(false);
                this.nextNPC();
            }, 2500);

        } else {
            // LOSE / GAME OVER
            this.lastResult = 'LOSE';
            banner.innerText = this.lang === 'ID' ? "KALAH!" : "YOU LOST!";
            banner.style.color = "#ff1744";
            document.getElementById('death-reason').innerText = this.lang === 'ID' ? "Pola kamu berhasil terbaca!" : "Your pattern was read easily!";

            setTimeout(() => {
                this.gameOver();
            }, 2500);
        }
    }

    gameOver() {
        this.stopTimer();
        document.getElementById('final-streak').innerText = this.streak;
        document.getElementById('final-score').innerText = this.score;
        document.getElementById('death-screen').style.display = 'flex';
    }
}

// Launch Engine
const game = new Game();
</script>
