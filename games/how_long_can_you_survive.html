<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>How Long Can You Survive? - Cross Platform Edition</title>
  <style>
    * { box-sizing: border-box; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
    body { margin: 0; background: #08090d; color: #fff; font-family: Arial, sans-serif; overflow: hidden; touch-action: none; }
    
    #game-wrapper {
      position: relative;
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    canvas {
      display: block;
      background: #171a22;
      max-width: 100vw;
      max-height: 100vh;
      aspect-ratio: 960 / 600;
      object-fit: contain;
    }

    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(8, 9, 13, 0.85);
      border: 1px solid #596273;
      border-radius: 8px;
      padding: 8px 12px;
      line-height: 1.4;
      font-size: 13px;
      z-index: 2;
    }

    #event {
      position: fixed;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 900;
      font-size: 20px;
      text-shadow: 0 2px 8px #000;
      z-index: 3;
      text-align: center;
      width: 90%;
      pointer-events: none;
      color: #ff3366;
    }

    /* KONTROL MOBILE (Default Sembunyi, Muncul di Layar Sentuh) */
    .mobile-ctrl {
      display: none;
    }

    @media (hover: none) and (pointer: coarse) {
      .mobile-ctrl { display: block; }
    }

    /* JOYSTICK FIX DI POJOK KANAN BAWAH */
    #joystick-container {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 130px;
      height: 130px;
      z-index: 6;
      touch-action: none;
    }

    #joystick-base {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
    }

    #joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 55px;
      height: 55px;
      background: rgba(89, 184, 255, 0.6);
      border: 2px solid #59b8ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* TOMBOL AKSI DI SEBELAH KIRI BAWAH */
    .action-btn {
      position: fixed;
      border-radius: 50%;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      z-index: 6;
      touch-action: none;
      user-select: none;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    #btn-dash {
      bottom: 25px;
      left: 25px;
      width: 75px;
      height: 75px;
      font-size: 13px;
      background: rgba(89, 184, 255, 0.35);
      border: 2px solid #59b8ff;
    }

    #btn-sprint {
      bottom: 115px;
      left: 30px;
      width: 60px;
      height: 60px;
      font-size: 11px;
      background: rgba(255, 215, 0, 0.35);
      border: 2px solid #ffd700;
    }

    .action-btn:active, .action-btn.active {
      transform: scale(0.92);
      background: rgba(255, 255, 255, 0.5);
    }

    #screen { position: fixed; inset: 0; background: #07090df5; display: flex; align-items: center; justify-content: center; z-index: 9; }
    .panel { width: min(620px, 90vw); padding: 24px; background: #12151d; border: 1px solid #596273; border-radius: 14px; box-shadow: 0 20px 80px #000; text-align: center; }
    h1 { font-size: 28px; margin: 0 0 10px; color: #ff4757; }
    p { line-height: 1.5; margin: 8px 0; }
    .muted { color: #aeb5c2; font-size: 13px; }
    button { padding: 14px 28px; background: #ff4757; color: white; border: none; border-radius: 7px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

<div id="game-wrapper">
  <canvas id="g" width="960" height="600"></canvas>
</div>

<div id="hud">
  <b>ABSURD SURVIVAL</b><br>
  Time: <span id="time">00:00.0</span> | HP: <span id="hp">❤️❤️❤️</span><br>
  Events: <span id="ev">0</span> | Threat Level: <span id="th">1</span>
</div>

<div id="event"></div>

<!-- Mobile Controls -->
<div id="btn-sprint" class="action-btn mobile-ctrl">RUN</div>
<div id="btn-dash" class="action-btn mobile-ctrl">DASH</div>
<div id="joystick-container" class="mobile-ctrl">
  <div id="joystick-base">
    <div id="joystick-stick"></div>
  </div>
</div>

<div id="screen">
  <div class="panel" id="panel">
    <h1>ABSURD SURVIVAL</h1>
    <p><b>Mobile:</b> RUN/DASH di Kiri, Joystick di Kanan.<br><b>Laptop:</b> WASD / Panah + Shift + Space.</p>
    <button id="start">START SURVIVING</button>
  </div>
</div>

<script>
const c=document.getElementById("g"),x=c.getContext("2d"),W=960,H=600,K={};
let run=0,dead=0,last=performance.now(),t=0,et=0,ec=0,th=1,inv=0,shake=0;
let lava=0,reverse=0,slip=0,black=0,timeScale=1;

const p={x:480,y:330,r:11,vx:0,vy:0,st:100,h:3};
let hz=[], npcs=[], parts=[], traps=[];

// VIRTUAL JOYSTICK STATE
let joyActive = false;
let joyTouchId = null;
let joyDir = { x: 0, y: 0 };

const say=s=>{let e=document.getElementById("event");e.textContent=s;e.style.opacity=1;clearTimeout(say.q);say.q=setTimeout(()=>e.style.opacity=0,1200)};
const d=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y), r=(a,b)=>a+Math.random()*(b-a);

function hud(){
  let m=Math.floor(t/60),s=Math.floor(t%60),q=Math.floor(t%1*10);
  document.getElementById("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+"."+q;
  document.getElementById("hp").textContent="❤️".repeat(Math.max(0,p.h))+"🖤".repeat(Math.max(0,3-p.h));
  document.getElementById("ev").textContent=ec;
  document.getElementById("th").textContent=th;
}

function hit(){if(inv>0||dead)return;p.h--;inv=1;shake=.4;say("💥 OUCH! WHO DID THAT?!");if(p.h<=0)die()}
function die(){
  dead=1;run=0;
  document.getElementById("screen").style.display="flex";
  document.getElementById("panel").innerHTML="<h1>YOU DIED</h1><p>Survived for <b>"+fmt(t)+"</b> with <b>"+ec+"</b> chaotic events.</p><button onclick='location.reload()'>PLAY AGAIN</button>";
}
function fmt(z){return String(Math.floor(z/60)).padStart(2,"0")+":"+String(Math.floor(z%60)).padStart(2,"0")+"."+Math.floor(z%1*10)}

function spawn(type){
  if(type=="meteor"){ hz.push({type,x:r(90,870),y:r(90,510),z:1.0,R:45}); say("☄️ METEOR INCOMING!"); }
  else if(type=="piano"){ hz.push({type,x:r(100,860),y:80,z:1.2,R:35}); say("🎹 ACME PIANO FALLING!"); }
  else if(type=="goose"){ hz.push({type,x:r(80,880),y:Math.random()<.5?70:530,z:8,R:16,sp:1.8+th*.1}); say("🪿 ANGRY GOOSE!"); }
  else if(type=="ghost"){ npcs.push({type:"ghost",x:r(80,880),y:r(80,520),z:10,R:14,sp:.9+th*.05}); say("👻 ANNOYING GHOST!"); }
  else if(type=="ufo"){ hz.push({type:"ufo",x:r(150,810),y:r(150,450),z:5,R:60}); say("🛸 UFO TRACTOR BEAM!"); }
  else if(type=="boulder"){ 
    let dir = Math.random() < .5;
    hz.push({type:"boulder", x: dir? 70 : 890, y: r(100,500), vx: (dir? 1 : -1)*(3+th*.3), z: 6, R:30});
    say("🪨 GIANT BOULDER ROLLING!");
  }
  else if(type=="bomb"){ traps.push({type:"bomb", x:r(100,860), y:r(100,500), timer: 1.2, R: 55}); say("💣 BOMB AREA!"); }
  else if(type=="banana"){ traps.push({type:"banana", x:r(100,860), y:r(100,500), timer: 10, R: 15}); say("🍌 BANANA SLIP!"); }
  else if(type=="ducks"){ for(let i=0;i<5;i++) hz.push({type:"goose",x:r(80,880),y:r(80,520),z:6,R:12,sp:1.4}); say("🦆 DUCK ARMY!"); }
  else { npcs.push({type:"npc",x:r(80,880),y:r(80,520),z:7,R:13,sp:.7+th*.03}); say("🧍 AGGRESSIVE NPC!"); }
}

function triggerEvent(){
  ec++;
  let pool = ["meteor","piano","goose","ghost","ufo","boulder","bomb","banana","ducks","npc","lava","reverse","slip","black","timewarp"];
  let q = pool[Math.floor(Math.random()*pool.length)];

  if(["meteor","piano","goose","ghost","ufo","boulder","bomb","banana","ducks","npc"].includes(q)) spawn(q);
  else if(q=="lava"){ lava=4; say("🌋 FLOOR IS LAVA!"); }
  else if(q=="reverse"){ reverse=!reverse; say(reverse?"🔄 CONTROLS REVERSED!":"🔄 CONTROLS NORMAL!"); }
  else if(q=="slip"){ slip=5; say("🧊 SLIPPERY FLOOR!"); }
  else if(q=="black"){ black=3.5; say("🌑 LIGHTS OUT!"); }
  else if(q=="timewarp"){ timeScale = Math.random() < .5 ? 1.8 : 0.5; setTimeout(()=>timeScale=1, 4000); say(timeScale>1?"⏩ SPEED UP!":"⏸️ SLOW MOTION!"); }
}

function move(dt){
  let a=0,b=0;
  
  if(K.w||K.KeyW||K.ArrowUp)b--; if(K.s||K.KeyS||K.ArrowDown)b++;
  if(K.a||K.KeyA||K.ArrowLeft)a--; if(K.d||K.KeyD||K.ArrowRight)a++;

  if(joyActive){ a = joyDir.x; b = joyDir.y; }

  if(reverse){a=-a;b=-b}
  
  if(a || b){
    let z = Math.hypot(a,b);
    if(z > 1) { a /= z; b /= z; }
    let sprint = (K.ShiftLeft || K.ShiftRight || K.sprint) && p.st > 0, sp = 2.8 * (sprint ? 1.75 : 1);
    if(sprint) p.st = Math.max(0, p.st - 40 * dt); else p.st = Math.min(100, p.st + 25 * dt);
    
    if(slip){ p.vx += a * sp * dt * 6; p.vy += b * sp * dt * 6; p.vx *= .98; p.vy *= .98; }
    else { p.vx = a * sp; p.vy = b * sp; }
  } else {
    p.st = Math.min(100, p.st + 25 * dt);
    if(!slip) p.vx = p.vy = 0;
  }
  p.x = Math.max(70, Math.min(890, p.x + p.vx * dt * 60 * timeScale));
  p.y = Math.max(80, Math.min(520, p.y + p.vy * dt * 60 * timeScale));
}

function update(dt){
  dt *= timeScale;
  move(dt);
  inv=Math.max(0,inv-dt); shake=Math.max(0,shake-dt*2); black=Math.max(0,black-dt);
  
  if(lava>0){ lava-=dt; if(Math.random()<dt*.6 && p.x>65&&p.x<895&&p.y>75&&p.y<525) hit(); }

  for(let i=hz.length-1;i>=0;i--){
    let a=hz[i];
    if(a.type=="goose"){
      a.z-=dt; let X=p.x-a.x, Y=p.y-a.y, Z=Math.hypot(X,Y)||1;
      a.x+=X/Z*a.sp*dt*60; a.y+=Y/Z*a.sp*dt*60;
      if(Z<28) hit(); if(a.z<=0) hz.splice(i,1);
    } else if(a.type=="boulder"){
      a.x += a.vx*dt*60;
      if(d(p,a)<a.R+8) hit();
      if(a.x < 50 || a.x > 910) hz.splice(i,1);
    } else if(a.type=="ufo"){
      a.z -= dt;
      if(d(p,a) < a.R) { p.x += r(-2,2); p.y -= 1.5; hit(); }
      if(a.z<=0) hz.splice(i,1);
    } else {
      a.z-=dt;
      if(a.z<=0){
        if(d(p,a)<a.R+10) hit();
        for(let j=0;j<15;j++) parts.push({x:a.x,y:a.y,vx:r(-4,4),vy:r(-4,4),z:.6});
        hz.splice(i,1);
      }
    }
  }

  for(let i=traps.length-1;i>=0;i--){
    let t=traps[i];
    if(t.type=="bomb"){
      t.timer -= dt;
      if(t.timer<=0){
        if(d(p,t) < t.R) hit();
        shake = .5;
        for(let j=0;j<20;j++) parts.push({x:t.x,y:t.y,vx:r(-6,6),vy:r(-6,6),z:.8});
        traps.splice(i,1);
      }
    } else if(t.type=="banana"){
      t.timer -= dt;
      if(d(p,t) < t.R){
        p.vx = r(-8,8); p.vy = r(-8,8); slip = 2; say("🍌 SLIPPED!");
        traps.splice(i,1);
      } else if(t.timer<=0) traps.splice(i,1);
    }
  }

  for(let i=npcs.length-1;i>=0;i--){
    let a=npcs[i], X=p.x-a.x, Y=p.y-a.y, Z=Math.hypot(X,Y)||1;
    a.x+=X/Z*a.sp*dt*60; a.y+=Y/Z*a.sp*dt*60; a.z-=dt;
    if(Z<25) hit();
    if(a.z<=0) npcs.splice(i,1);
  }

  for(let i=parts.length-1;i>=0;i--){
    let a=parts[i]; a.x+=a.vx*dt*60; a.y+=a.vy*dt*60; a.vy+=.1; a.z-=dt;
    if(a.z<=0) parts.splice(i,1);
  }
}

function draw(){
  x.clearRect(0,0,W,H);
  x.save();
  if(shake > 0) x.translate(r(-shake*15, shake*15), r(-shake*15, shake*15));

  x.fillStyle="#171a22"; x.fillRect(0,0,W,H);
  x.strokeStyle="#252b35";
  for(let a=70;a<900;a+=32) for(let b=80;b<520;b+=32) x.strokeRect(a,b,32,32);

  x.strokeStyle="#697181"; x.lineWidth=4; x.strokeRect(65,75,830,450); x.lineWidth=1;
  if(lava>0){ x.fillStyle="#702a20"; x.fillRect(65,75,830,450); }

  for(let t of traps){
    if(t.type=="bomb"){
      x.fillStyle="rgba(255, 0, 0, 0.3)"; x.beginPath(); x.arc(t.x,t.y,t.R,0,7); x.fill();
      x.fillStyle="#000"; x.beginPath(); x.arc(t.x,t.y,10,0,7); x.fill();
    } else if(t.type=="banana"){
      x.fillStyle="#ffeaa7"; x.beginPath(); x.arc(t.x,t.y,8,0,7); x.fill();
    }
  }

  for(let a of hz){
    if(a.type=="meteor"){
      x.fillStyle="#bd4937"; x.beginPath(); x.arc(a.x,a.y,a.R,0,7); x.fill();
    } else if(a.type=="piano"){
      x.fillStyle="#111"; x.fillRect(a.x-30,a.y-18,60,36);
    } else if(a.type=="boulder"){
      x.fillStyle="#636e72"; x.beginPath(); x.arc(a.x,a.y,a.R,0,7); x.fill();
    } else if(a.type=="ufo"){
      x.fillStyle="rgba(0, 255, 200, 0.25)"; x.beginPath(); x.arc(a.x,a.y,a.R,0,7); x.fill();
      x.fillStyle="#81ecec"; x.fillRect(a.x-20,a.y-5,40,10);
    } else {
      x.fillStyle="#eee"; x.beginPath(); x.arc(a.x,a.y,a.R,0,7); x.fill();
    }
  }

  for(let a of npcs){
    x.fillStyle = a.type=="ghost" ? "rgba(255,255,255,0.6)" : "#b98c67";
    x.beginPath(); x.arc(a.x,a.y,a.R,0,7); x.fill();
  }

  for(let a of parts){ x.fillStyle="#ff7675"; x.fillRect(a.x,a.y,4,4); }

  if(inv==0||Math.floor(inv*12)%2==0){
    x.fillStyle="#59b8ff"; x.beginPath(); x.arc(p.x,p.y,p.r,0,7); x.fill();
    x.fillStyle="#fff"; x.beginPath(); x.arc(p.x-4,p.y-3,2,0,7); x.arc(p.x+4,p.y-3,2,0,7); x.fill();
  }

  if(black>0){
    x.fillStyle="#000e"; x.fillRect(0,0,W,H);
    x.fillStyle="#fff"; x.font="20px Arial"; x.textAlign="center";
    x.fillText("PITCH BLACK!",480,300);
  }

  x.restore();
}

function loop(now){
  let dt=Math.min(.035,(now-last)/1000); last=now;
  if(run&&!dead){
    t+=dt; th=1+Math.floor(t/15);
    if((et+=dt) >= Math.max(0.6, 3.5 - t*.05)){ et=0; triggerEvent(); }
    update(dt); hud();
  }
  draw(); requestAnimationFrame(loop);
}

// LOGIKA JOYSTICK TETAP (POJOK KANAN BAWAH)
const joyContainer = document.getElementById("joystick-container");
const joyStick = document.getElementById("joystick-stick");

function handleJoyMove(clientX, clientY) {
  const rect = joyContainer.getBoundingClientRect();
  const centerX = rect.left + rect.width / 2;
  const centerY = rect.top + rect.height / 2;
  
  let dx = clientX - centerX;
  let dy = clientY - centerY;
  let dist = Math.hypot(dx, dy);
  let maxDist = rect.width / 2;

  if (dist > maxDist) {
    dx = (dx / dist) * maxDist;
    dy = (dy / dist) * maxDist;
  }

  joyStick.style.transform = `translate(-50%, -50%) translate(${dx}px, ${dy}px)`;
  joyDir = { x: dx / maxDist, y: dy / maxDist };
}

joyContainer.addEventListener("touchstart", e => {
  e.preventDefault();
  joyActive = true;
  joyTouchId = e.changedTouches[0].identifier;
  handleJoyMove(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
});

window.addEventListener("touchmove", e => {
  if (!joyActive) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joyTouchId) {
      handleJoyMove(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
    }
  }
});

const resetJoy = e => {
  if (!joyActive) return;
  for (let i = 0; i < e.changedTouches.length; i++) {
    if (e.changedTouches[i].identifier === joyTouchId) {
      joyActive = false;
      joyTouchId = null;
      joyStick.style.transform = `translate(-50%, -50%) translate(0px, 0px)`;
      joyDir = { x: 0, y: 0 };
    }
  }
};
window.addEventListener("touchend", resetJoy);
window.addEventListener("touchcancel", resetJoy);

// BIND TOMBOL RUN & DASH (SISI KIRI BAWAH)
function bindBtn(id, keyName){
  const el = document.getElementById(id);
  const start = (e) => { e.preventDefault(); K[keyName] = 1; el.classList.add('active'); };
  const end = (e) => { e.preventDefault(); K[keyName] = 0; el.classList.remove('active'); };
  el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
  el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
}

bindBtn('btn-sprint', 'sprint');

const dashBtn = document.getElementById('btn-dash');
const dashStart = (e) => { e.preventDefault(); triggerDash(); dashBtn.classList.add('active'); };
const dashEnd = (e) => { e.preventDefault(); dashBtn.classList.remove('active'); };
dashBtn.addEventListener('touchstart', dashStart); dashBtn.addEventListener('touchend', dashEnd);
dashBtn.addEventListener('mousedown', dashStart); dashBtn.addEventListener('mouseup', dashEnd);

function triggerDash(){
  if(!run||dead) return;
  p.vx*=3.2; p.vy*=3.2;
  setTimeout(()=>{p.vx*=.2; p.vy*=.2},120);
}

// KEYBOARD BINDING (LAPTOP/PC)
document.addEventListener("keydown",e=>{
  K[e.code]=1; K[e.key]=1;
  if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].includes(e.code)) e.preventDefault();
  if(e.code=="Space"&&run&&!dead) triggerDash();
});
document.addEventListener("keyup",e=>{ K[e.code]=0; K[e.key]=0; });

document.getElementById("start").onclick=()=>{
  run=1; document.getElementById("screen").style.display="none"; say("SURVIVE IF YOU CAN!");
};

hud(); requestAnimationFrame(loop);
</script>
</body>
</html>
