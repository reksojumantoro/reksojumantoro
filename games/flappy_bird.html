<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Flappy Meme - Ultra Responsive</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* Mematikan delay scroll & double tap zoom bawaan HP */
      touch-action: none;
    }
    #game-container {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    canvas {
      background: linear-gradient(to bottom, #0f3460, #16213e);
      box-shadow: 0 10px 25px rgba(0,0,0,0.7);
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas"></canvas>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // Penyesuaian ukuran canvas mengikuti layar HP secara dinamis
  function resizeCanvas() {
    const maxWidth = 420;
    const maxHeight = 750;

    let w = window.innerWidth;
    let h = window.innerHeight;

    if (w / h > maxWidth / maxHeight) {
      w = h * (maxWidth / maxHeight);
    } else {
      h = w * (maxHeight / maxWidth);
    }

    canvas.width = w;
    canvas.height = h;
  }

  window.addEventListener('resize', () => {
    resizeCanvas();
    if (!gameStarted) initGame();
  });
  resizeCanvas();

  let frames = 0;
  let score = 0;
  let highScore = 0;
  let gameOver = false;
  let gameStarted = false;

  const memeList = ["🤡", "🗿", "💀", "🤓", "🤪", "👻", "👺", "👽"];

  // Background Meme Pop-up
  const memeBackground = {
    currentMeme: null,
    timer: 0,
    
    update() {
      if (!gameStarted || gameOver) return;

      if (frames % 140 === 0) {
        this.currentMeme = {
          symbol: memeList[Math.floor(Math.random() * memeList.length)],
          x: Math.floor(Math.random() * (canvas.width - 100)) + 50,
          y: Math.floor(Math.random() * (canvas.height - 150)) + 50,
          size: Math.floor(canvas.width * 0.22),
          opacity: 0.35
        };
        this.timer = 80;
      }

      if (this.timer > 0) {
        this.timer--;
        if (this.timer === 0) this.currentMeme = null;
      }
    },

    draw() {
      if (this.currentMeme) {
        ctx.save();
        ctx.globalAlpha = this.currentMeme.opacity;
        ctx.font = `${this.currentMeme.size}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.currentMeme.symbol, this.currentMeme.x, this.currentMeme.y);
        ctx.restore();
      }
    }
  };

  // Karakter Player
  const bird = {
    x: 0,
    y: 0,
    radius: 0,
    gravity: 0,
    jump: 0,
    velocity: 0,
    rotation: 0,

    init() {
      this.x = canvas.width * 0.22;
      this.y = canvas.height * 0.4;
      this.radius = canvas.width * 0.045;
      
      // Fisika dibuat lebi snappy & garing (tanpa delay)
      this.gravity = canvas.height * 0.00095;
      this.jump = canvas.height * 0.014;
    },
    
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      
      this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity / (canvas.height * 0.018))));
      ctx.rotate(this.rotation);

      const fontSize = Math.floor(this.radius * 1.6);
      ctx.font = `${fontSize}px serif`;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("👾", 0, 0);

      ctx.restore();
    },
    
    flap() {
      // KUNCI RESPONSIF: Matikan kecepatan jatuh secara instan sebelum lompat
      this.velocity = 0;
      this.velocity = -this.jump;
    },
    
    update() {
      if (!gameStarted) return;
      
      this.velocity += this.gravity;
      this.y += this.velocity;

      const groundHeight = canvas.height * 0.06;
      if (this.y + this.radius >= canvas.height - groundHeight) {
        this.y = canvas.height - groundHeight - this.radius;
        endGame();
      }

      if (this.y - this.radius <= 0) {
        this.y = this.radius;
        this.velocity = 0;
      }
    },
    
    reset() {
      this.init();
      this.velocity = 0;
      this.rotation = 0;
    }
  };

  // Pipa
  const pipes = {
    position: [],
    w: 0,
    gap: 0,
    dx: 0,

    init() {
      this.w = canvas.width * 0.15;
      this.gap = canvas.height * 0.20;
      this.dx = canvas.width * 0.0075;
    },

    draw() {
      const groundHeight = canvas.height * 0.06;
      for (let i = 0; i < this.position.length; i++) {
        let p = this.position[i];
        let topY = p.y;
        let bottomY = p.y + this.gap;

        let grad = ctx.createLinearGradient(p.x, 0, p.x + this.w, 0);
        grad.addColorStop(0, '#e94560');
        grad.addColorStop(1, '#0f3460');

        ctx.fillStyle = grad;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;

        // Pipa atas
        ctx.fillRect(p.x, 0, this.w, topY);
        ctx.strokeRect(p.x, 0, this.w, topY);

        // Pipa bawah
        ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY - groundHeight);
        ctx.strokeRect(p.x, bottomY, this.w, canvas.height - bottomY - groundHeight);
      }
    },

    update() {
      if (!gameStarted || gameOver) return;

      if (frames % 75 === 0) {
        const groundHeight = canvas.height * 0.06;
        const minTop = canvas.height * 0.1;
        const maxTop = canvas.height - groundHeight - this.gap - (canvas.height * 0.1);
        
        this.position.push({
          x: canvas.width,
          y: Math.floor(Math.random() * (maxTop - minTop)) + minTop
        });
      }

      for (let i = 0; i < this.position.length; i++) {
        let p = this.position[i];
        p.x -= this.dx;

        let birdTop = bird.y - bird.radius;
        let birdBottom = bird.y + bird.radius;
        let birdLeft = bird.x - bird.radius;
        let birdRight = bird.x + bird.radius;

        if (birdRight > p.x && birdLeft < p.x + this.w) {
          if (birdTop < p.y || birdBottom > p.y + this.gap) {
            endGame();
          }
        }

        if (p.x + this.w < bird.x && !p.passed) {
          score++;
          p.passed = true;
        }

        if (p.x + this.w <= 0) {
          this.position.shift();
          i--;
        }
      }
    },

    reset() {
      this.position = [];
      this.init();
    }
  };

  // Tanah
  const fg = {
    draw() {
      const groundHeight = canvas.height * 0.06;
      ctx.fillStyle = "#16213e";
      ctx.fillRect(0, canvas.height - groundHeight, canvas.width, groundHeight);
      
      ctx.strokeStyle = "#e94560";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - groundHeight);
      ctx.lineTo(canvas.width, canvas.height - groundHeight);
      ctx.stroke();
    }
  };

  function endGame() {
    gameOver = true;
    if (score > highScore) highScore = score;
  }

  function resetGame() {
    bird.reset();
    pipes.reset();
    memeBackground.currentMeme = null;
    score = 0;
    frames = 0;
    gameOver = false;
    gameStarted = true;
  }

  // SYSTEM INPUT SUPER INSTAN (Bypass delay browser HP)
  function handleAction(e) {
    if (e) {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
    }

    if (!gameStarted) {
      gameStarted = true;
    } else if (gameOver) {
      resetGame();
    } else {
      bird.flap();
    }
  }

  // Gunakan Pointer Event & Touch Event dengan Listener Passive False
  window.addEventListener("pointerdown", handleAction, { passive: false });
  window.addEventListener("touchstart", handleAction, { passive: false });

  // Keyboard Space untuk Laptop/PC
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") handleAction(e);
  });

  function drawUI() {
    ctx.fillStyle = "#FFF";

    if (!gameStarted) {
      ctx.textAlign = "center";
      ctx.font = `bold ${Math.floor(canvas.width * 0.05)}px sans-serif`;
      ctx.fillText("TAP LAYAR UNTUK MULAI", canvas.width / 2, canvas.height / 2);
    } else if (gameOver) {
      ctx.fillStyle = "rgba(15, 52, 96, 0.85)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.textAlign = "center";
      ctx.fillStyle = "#e94560";
      ctx.font = `bold ${Math.floor(canvas.width * 0.08)}px sans-serif`;
      ctx.fillText("YOU DIED!", canvas.width / 2, canvas.height * 0.35);
      
      ctx.fillStyle = "#FFF";
      ctx.font = `${Math.floor(canvas.width * 0.05)}px sans-serif`;
      ctx.fillText(`Skor: ${score}`, canvas.width / 2, canvas.height * 0.45);
      ctx.fillText(`Best: ${highScore}`, canvas.width / 2, canvas.height * 0.50);
      
      ctx.fillStyle = "#4ecca3";
      ctx.fillText("Tap untuk Coba Lagi", canvas.width / 2, canvas.height * 0.60);
    } else {
      ctx.textAlign = "left";
      ctx.font = `bold ${Math.floor(canvas.width * 0.08)}px sans-serif`;
      ctx.fillText(score, canvas.width * 0.06, canvas.height * 0.08);
    }
  }

  function initGame() {
    bird.init();
    pipes.init();
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    memeBackground.update();
    memeBackground.draw();

    pipes.update();
    pipes.draw();
    
    fg.draw();
    
    bird.update();
    bird.draw();

    drawUI();

    frames++;
    requestAnimationFrame(loop);
  }

  initGame();
  loop();
</script>

</body>
</html>
