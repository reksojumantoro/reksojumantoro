<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Flappy Meme Hardcore</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1a1a2e;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: white;
      overflow: hidden;
    }
    #game-container {
      text-align: center;
    }
    canvas {
      border: 4px solid #16213e;
      border-radius: 12px;
      background: linear-gradient(to bottom, #0f3460, #16213e);
      box-shadow: 0 15px 30px rgba(0,0,0,0.7);
    }
    p {
      margin-top: 12px;
      font-size: 14px;
      color: #e94560;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div id="game-container">
  <canvas id="canvas" width="360" height="520"></canvas>
  <p>SPASI / KLIK untuk lompat | Focus!</p>
</div>

<script>
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  let frames = 0;
  let score = 0;
  let highScore = 0;
  let gameOver = false;
  let gameStarted = false;

  // Daftar Emoji Meme Face buat Popup Background
  const memeList = ["🤡", "🗿", "💀", "🤓", "🤪", "👻", "👺", "👽"];

  // Background Meme Pop-up Manager
  const memeBackground = {
    currentMeme: null,
    timer: 0,
    
    update() {
      if (!gameStarted || gameOver) return;

      // Tiap ~2,5 detik (150 frames), ganti/munculin meme baru di posisi acak
      if (frames % 150 === 0) {
        this.currentMeme = {
          symbol: memeList[Math.floor(Math.random() * memeList.length)],
          x: Math.floor(Math.random() * (canvas.width - 100)) + 50,
          y: Math.floor(Math.random() * (canvas.height - 150)) + 50,
          size: Math.floor(Math.random() * 60) + 60, // Ukuran jumbo biar berdistraksi
          opacity: 0.35 // Semi-transparan biar tetap kelihatan jalurnya
        };
        this.timer = 90; // Muncul selama 90 frame (~1.5 detik)
      }

      if (this.timer > 0) {
        this.timer--;
        if (this.timer === 0) this.currentMeme = null;
      }
    },

    draw() {
      if (this.currentMeme) {
        ctx.save();
        ctx.globalAlpha = this.currentMeme.opacity;
        ctx.font = `${this.currentMeme.size}px serif`;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(this.currentMeme.symbol, this.currentMeme.x, this.currentMeme.y);
        ctx.restore();
      }
    }
  };

  // Karakter Player
  const bird = {
    x: 60,
    y: 200,
    radius: 18,
    gravity: 0.38,
    jump: 6.2,
    velocity: 0,
    rotation: 0,
    
    draw() {
      ctx.save();
      ctx.translate(this.x, this.y);
      
      this.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (this.velocity / 10)));
      ctx.rotate(this.rotation);

      ctx.font = "28px serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("👾", 0, 0);

      ctx.restore();
    },
    
    flap() {
      this.velocity = -this.jump;
    },
    
    update() {
      if (!gameStarted) return;
      
      this.velocity += this.gravity;
      this.y += this.velocity;

      // Benturan Tanah
      if (this.y + this.radius >= canvas.height - 30) {
        this.y = canvas.height - 30 - this.radius;
        endGame();
      }

      // Atap
      if (this.y - this.radius <= 0) {
        this.y = this.radius;
        this.velocity = 0;
      }
    },
    
    reset() {
      this.y = 200;
      this.velocity = 0;
      this.rotation = 0;
    }
  };

  // Pipa
  const pipes = {
    position: [],
    w: 55,
    gap: 98, // Celah sempit (susah)
    dx: 3,   // Speed cepat

    draw() {
      for (let i = 0; i < this.position.length; i++) {
        let p = this.position[i];
        let topY = p.y;
        let bottomY = p.y + this.gap;

        let grad = ctx.createLinearGradient(p.x, 0, p.x + this.w, 0);
        grad.addColorStop(0, '#e94560');
        grad.addColorStop(1, '#0f3460');

        ctx.fillStyle = grad;
        ctx.strokeStyle = "#fff";
        ctx.lineWidth = 2;

        // Pipa atas
        ctx.fillRect(p.x, 0, this.w, topY);
        ctx.strokeRect(p.x, 0, this.w, topY);

        // Pipa bawah
        ctx.fillRect(p.x, bottomY, this.w, canvas.height - bottomY - 30);
        ctx.strokeRect(p.x, bottomY, this.w, canvas.height - bottomY - 30);
      }
    },

    update() {
      if (!gameStarted || gameOver) return;

      if (frames % 75 === 0) {
        this.position.push({
          x: canvas.width,
          y: Math.floor(Math.random() * (canvas.height - 220 - this.gap)) + 40
        });
      }

      for (let i = 0; i < this.position.length; i++) {
        let p = this.position[i];
        p.x -= this.dx;

        // Hitbox Pipa
        let birdTop = bird.y - bird.radius;
        let birdBottom = bird.y + bird.radius;
        let birdLeft = bird.x - bird.radius;
        let birdRight = bird.x + bird.radius;

        if (birdRight > p.x && birdLeft < p.x + this.w) {
          if (birdTop < p.y || birdBottom > p.y + this.gap) {
            endGame();
          }
        }

        // Skor
        if (p.x + this.w < bird.x && !p.passed) {
          score++;
          p.passed = true;
        }

        if (p.x + this.w <= 0) {
          this.position.shift();
          i--;
        }
      }
    },

    reset() {
      this.position = [];
    }
  };

  // Tanah
  const fg = {
    h: 30,
    draw() {
      ctx.fillStyle = "#16213e";
      ctx.fillRect(0, canvas.height - this.h, canvas.width, this.h);
      
      ctx.strokeStyle = "#e94560";
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, canvas.height - this.h);
      ctx.lineTo(canvas.width, canvas.height - this.h);
      ctx.stroke();
    }
  };

  function endGame() {
    gameOver = true;
    if (score > highScore) highScore = score;
  }

  function resetGame() {
    bird.reset();
    pipes.reset();
    memeBackground.currentMeme = null;
    score = 0;
    frames = 0;
    gameOver = false;
    gameStarted = true;
  }

  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") handleInput();
  });

  canvas.addEventListener("click", handleInput);

  function handleInput() {
    if (!gameStarted) {
      gameStarted = true;
    } else if (gameOver) {
      resetGame();
    } else {
      bird.flap();
    }
  }

  function drawUI() {
    ctx.fillStyle = "#FFF";
    ctx.font = "bold 18px sans-serif";

    if (!gameStarted) {
      ctx.textAlign = "center";
      ctx.fillText("KLIK / SPASI UNTUK MULAI", canvas.width / 2, canvas.height / 2);
    } else if (gameOver) {
      ctx.fillStyle = "rgba(15, 52, 96, 0.85)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.textAlign = "center";
      ctx.fillStyle = "#e94560";
      ctx.font = "bold 32px sans-serif";
      ctx.fillText("YOU DIED!", canvas.width / 2, 180);
      
      ctx.fillStyle = "#FFF";
      ctx.font = "18px sans-serif";
      ctx.fillText(`Skor Kamu: ${score}`, canvas.width / 2, 230);
      ctx.fillText(`Skor Tertinggi: ${highScore}`, canvas.width / 2, 260);
      
      ctx.fillStyle = "#4ecca3";
      ctx.fillText("Klik untuk Coba Lagi", canvas.width / 2, 320);
    } else {
      ctx.textAlign = "left";
      ctx.font = "bold 28px sans-serif";
      ctx.fillText(score, 20, 45);
    }
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Render meme di layer paling belakang
    memeBackground.update();
    memeBackground.draw();

    pipes.update();
    pipes.draw();
    
    fg.draw();
    
    bird.update();
    bird.draw();

    drawUI();

    frames++;
    requestAnimationFrame(loop);
  }

  loop();
</script>

</body>
</html>
